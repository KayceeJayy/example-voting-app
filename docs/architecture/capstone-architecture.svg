<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1270" viewBox="0 0 1700 1270" role="img" aria-labelledby="arch-title arch-desc">
<title id="arch-title">DevOps Capstone 1 architecture</title>
<desc id="arch-desc">GitHub branch pushes automatically run CI with build, Trivy scans, Helm validation and integration tests. A deliberate release tag triggers scanned image publication to GHCR. An operator promotes verified images into private ECR and manually deploys with Helm to Terraform-managed AWS EKS. In Kubernetes, a browser connects through local port forwards to Vote and Result; Vote sends messages to Redis, Worker consumes them and writes PostgreSQL, and Result reads the database. PostgreSQL uses an encrypted 8 GiB gp3 EBS persistent volume. Redis is ephemeral.</desc>
